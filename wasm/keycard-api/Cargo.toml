[package]
name = "keycard-api"
description = "Keycard's OutLayer app: calls the provider's API with a key only the TEE can read, and encrypts the answer to the card holder"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "keycard-api"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
crypto_box = { version = "0.9.1", features = ["seal", "std", "getrandom"] }
wasi-http-client = "0.2.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
